name: Code Extension CI

on:
  push:
    branches: [ test-workflow, 'wip/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  code-ext:
    name: Code-Ext-CI-Verification
    # The extension needs Node and nothing else - no MariaDB server, no shell -
    # so a hosted runner is enough, for forks and for the repository alike.
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The pin lives in one place, and .nvmrc is the one a contributor's
          # `nvm use` reads too - so CI and a developer machine cannot drift
          # onto different npm majors, which is what silently rewrites
          # package-lock.json.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # `npm ci`, never `npm install`: it installs exactly what the lockfile
        # says and fails instead of quietly resolving something else, and it
        # never writes the lockfile back.
        run: npm ci

      - name: Read the pinned ai-plugins release
        id: skills
        run: echo "release=$(node -p "require('./package.json').aiPlugins.release")" >> "$GITHUB_OUTPUT"

      - name: Restore the Copilot skills
        # skills/ is a cache of the pinned release, not committed; a run
        # downloads it only when the pin is one the cache has not seen.
        uses: actions/cache@v4
        with:
          path: skills
          key: ai-plugins-skills-${{ steps.skills.outputs.release }}

      - name: Fetch the Copilot skills
        # Before the tests, which hold package.json's chatSkills against
        # what the pinned release has.
        run: npm run sync:skills

      - name: Type check and lint
        run: npm run pretest

      - name: Check the OpenAPI UI pins against the mrs plugin
        # The dialog's Swagger UI release and request path are copies of
        # what rest_plugin pins; the plugins repository is public, so the
        # comparison needs no token.
        run: python3 tools/check_openapi_ui_pins.py

      - name: Run the tests
        run: npm test

      - name: Build and package the extension
        # `vsce package` runs the build through `vscode:prepublish` first.
        # The build is here because the extension ships as a bundle, so a
        # bundling failure - an import that only resolves under the test
        # aliases, an asset that is not copied - is invisible to the type
        # check and the tests alike; the packaging is here so that what
        # .vscodeignore lets through is seen on every change, not at release
        # time. --no-dependencies: the runtime dependencies are bundled into
        # dist/ by Vite, so node_modules has nothing to ship.
        run: npm run package

      - name: Check that the build left package.json as committed
        # The skill sync rewrites chatSkills to match the pinned release; a
        # change here means the pin moved without the list moving with it.
        run: git diff --exit-code package.json

      - name: Keep the .vsix
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-dev-vsix
          path: '*.vsix'
          if-no-files-found: error
